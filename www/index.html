<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00b7c7">
  <title>Dealyx</title>
  <style>
    :root{color-scheme:light;background:#eefbfc;color:#12323d;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 75% 15%,#d4f7f9,transparent 40%),linear-gradient(145deg,#f8feff,#e7f9fb)}
    main{text-align:center;padding:32px;max-width:480px}img{width:104px;height:104px;border-radius:26px;box-shadow:0 12px 28px #00a7ba30}h1{margin:22px 0 8px;font-size:2rem;letter-spacing:-.04em}p{margin:0;color:#45636d;line-height:1.65}
    .bar{height:5px;width:92px;margin:20px auto;border-radius:9px;background:linear-gradient(90deg,#20d6de,#00b7c7,#087f98)}
  </style>
</head>
<body><main><img src="assets/logo.png" alt="Dealyx"><h1>Dealyx</h1><div class="bar"></div><p>Aqua-branded marketplace and community.</p></main></body>
</html>
