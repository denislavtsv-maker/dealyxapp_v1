name: Build Dealyx Aqua Android App (Back Navigation)

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.2.${{ github.run_number }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript Capacitor config
        run: npx tsc --noEmit --skipLibCheck --moduleResolution bundler --module ESNext --target ES2020 capacitor.config.ts

      - name: Generate Android project
        run: npx cap add android

      - name: Patch WebView session persistence
        run: node scripts/patch-android.mjs

      - name: Verify WebView cookies and Android Back navigation
        run: node scripts/patch-android.mjs --check

      - name: Set Android version for upgrade builds
        run: node scripts/set-android-version.mjs

      - name: Generate Aqua icon and splash assets
        run: npm run assets:generate

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK for testing
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dealyx-aqua-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure release keystore (optional)
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/dealyx-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/dealyx-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing skipped: add the four ANDROID_* GitHub Secrets to enable release APK/AAB builds."
          fi

      - name: Configure signed release build
        if: steps.signing.outputs.available == 'true'
        run: node scripts/configure-release-signing.mjs

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload signed release builds
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dealyx-aqua-release-apk-aab
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
